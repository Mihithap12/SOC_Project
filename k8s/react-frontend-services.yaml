# -------------------------------------------------------------
# Frontend Farmer (Port 3000)
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend-farmer
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend-farmer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-farmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-farmer
  template:
    metadata:
      labels:
        app: frontend-farmer
    spec:
      containers:
        - name: frontend-farmer
          image: frontend-farmer:latest
          ports:
            - containerPort: 3000

---

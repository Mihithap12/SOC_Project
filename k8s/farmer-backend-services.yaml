# -------------------------------------------------------------
# User Service (Port 8081)
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_HOST
              value: mysql
            - name: DATABASE_USER
              value: root
            - name: DATABASE_PASSWORD
              value: root

---

# -------------------------------------------------------------
# Order Service (Port 8085)
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: DATABASE_HOST
              value: mysql
            - name: DATABASE_USER
              value: root
            - name: DATABASE_PASSWORD
              value: root
            - name: MARKETPLACE_SERVICE_HOST
              value: marketplace-service
            - name: PAYMENT_SERVICE_HOST
              value: payment-service
            - name: TRANSPORT_SERVICE_HOST
              value: transport-service
            - name: NOTIFICATION_SERVICE_HOST
              value: notification-service


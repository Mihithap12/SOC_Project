# -------------------------------------------------------------
# Government Service (Port 8091)
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: government-service
spec:
  ports:
    - port: 8091
      targetPort: 8091
  selector:
    app: government-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: government-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: government-service
  template:
    metadata:
      labels:
        app: government-service
    spec:
      containers:
        - name: government-service
          image: project-government-service:latest
          ports:
            - containerPort: 8091
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:27017/govt_db

---
# -------------------------------------------------------------
# NGO Service (Port 8092)
